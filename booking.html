<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="booking style.css" />
    <title>Trip Preparation</title>
  </head>
  <body>
    <header>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="Cairo.html">Cairo</a></li>
          <li><a href="Alexandria.html">Alexandria</a></li>
          <li><a href="Luxor.html">Luxor</a></li>
          <li><a href="Aswan.html">Aswan</a></li>
          <li><a href="booking.html" class="active">Booking</a></li>
        </ul>
      </nav>
    </header>
    <form action="">
      <h1>Trip Preparation</h1>
      <p>
        Before you go on your trip, please fill out the following information:
      </p>
      <div>
        <label for="name">Name:</label>
        <input
          type="text"
          id="name"
          name="name"
          placeholder="Enter your name"
        />
      </div>
      <div>
        <label for="email">Email:</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="Enter your email"
        />
      </div>
      <div>
      <label for="phone">Phone Number:</label>
      <input
        type="tel"
        id="phone"
        name="phone"
        placeholder="Enter your phone number"/>
        <br><br>
      <div>
        <label for="date">Trip Date:</label>
        <input type="date" id="date" name="date" />
      </div>
      <div>
        <label for="male">Gender:</label>
        <input type="radio" id="male" name="gender" value="male" />
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female" />
        <label for="female">Female</label>
      </div>
      <div>
        <label for="ticket">Ticket Number:</label>
        <input
          type="number"
          id="ticket"
          name="ticket"
          max="5"
          min="1"
          placeholder="Enter ticket number"
        />
      </div>
      <div>
        <label for="City">Destination:</label>
        <select id="City" name="destination">
          <option value="Cairo">Cairo</option>
          <option value="Alexandria">Alexandria</option>
          <option value="luxor">Luxor</option>
          <option value="Aswan">Aswan</option>
        </select>
      </div>
      <div>
        <p>choose what services you need:</p>
      </div>
      <div>
        <input type="checkbox" id="hotel" name="services" value="hotel" />
        <label for="hotel">Hotel</label>
        <br />
        <input
          type="checkbox"
          id="transportation"
          name="services"
          value="transportation"
        />
        <label for="transportation">Transportation</label>
        <br />
        <input
          type="checkbox"
          id="tourguide"
          name="services"
          value="tourguide"
        />
        <label for="tourguide">Tour Guide</label>
        <br><br>
        <div>
          <label for="card">card number:</label>
          <input
            type="number"
            id="card"
            name="card"
            placeholder="Enter your card number"
          />
        </div>
        <div>
          <label for="amount">Payment Amount:</label>
          <input
            type="number"
            id="amount"
            name="amount"
            min="300"
            max="10000"
            placeholder="Enter your payment amount"
          />
          <select id="Payment" name="Payment">
            <option value="Visa">Visa</option>
            <option value="Cash">Cash</option>
            <option value="MasterCard">MasterCard</option>
          </select>
        </div>
      </div>
      <div>
        <video autoplay muted loop width="500" height="300">
          <source src="trip.mp4.mp4" type="video/mp4" />
        </video>
      </div>
      <div>
        <label for="upload">Upload Ticket:</label>
        <input type="file" id="upload" name="upload" />
      </div>
      <div>
        <label for="notes">Additional Notes:</label>
        <input
          type="text"
          id="notes"
          name="notes"
          placeholder="Enter any additional notes"
        />
      </div>
      <input type="submit" value="Submit" />
      <input type="reset" value="Reset" />
    </form>
  </body>
</html>
